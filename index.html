<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./stylesheet css/all.min.css">
    <link rel="stylesheet" href="./stylesheet css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="./stylesheet css/bootstrap.min.css">
    <link rel="stylesheet" href="./stylesheet css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!-- header -->
<div class="container navbar">
<div class="brand">
        <div class="logo"><i class="fa-solid fa-address-book"></i></div>
        <div>
          <h1>Contact<span>Hub</span></h1>
          <p>Smart Contact Manager</p>
        </div>
      </div>
      <div class="right">
        <button class="add btn" id="addBtn"><i class="fa-solid fa-plus"></i>&nbsp; Add Contact</button>
        <button class="ic btn" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
        <button class="ic btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
        <div class="me"><i class="fa-solid fa-user"></i></div>
      </div>
    </div>
<!-- STATS -->
 <div class="container">
    <div class="stats">
      <div class="stat ">
        <div class="sic blue"><i class="fa-solid fa-user-group"></i></div>
        <div><small>Total</small><b id="sTotal">0</b></div>
      </div>
      <div class="stat  ">
        <div class="sic orange"><i class="fa-solid fa-star"></i></div>
        <div><small>Favorites</small><b id="sFav">0</b></div>
      </div>
      <div class="stat  ">
        <div class="sic red"><i class="fa-solid fa-heart-pulse"></i></div>
        <div><small>Emergency</small><b id="sEmg">0</b></div>
      </div>
    </div>

    <!-- mai content -->
     <div class="main">
      <section>
        <h2>All Contacts</h2>
        <p class="sub" id="sub"></p>
        <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search"
            placeholder="Search by name, phone, or email..." aria-label="Search contacts"></div>
        <div class="list" id="list"></div>
      </section>
      <aside>
        <div class="panel">
          <div class="ph f">
            <div class="sic orange"><i class="fa-solid fa-star"></i></div>
            <div>
              <h3>Favorites</h3>
              <p>Quick access to starred contacts</p>
            </div>
          </div>
          <div class="pb" id="favList"></div>
        </div>
        <div class="panel">
          <div class="ph e">
            <div class="sic red"><i class="fa-solid fa-heart-pulse"></i></div>
            <div>
              <h3>Emergency</h3>
              <p>Important contacts for urgent calls</p>
            </div>
          </div>
          <div class="pb" id="emgList"></div>
        </div>
      </aside>
    </div>
 </div>


 <!-- the form alert -->

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mbox">
      <h3 id="mTitle">Add Contact</h3>
      <div class="f"><label for="name">Full name</label><input id="name" autocomplete="off"><small>Enter a name (2
          letters or more).</small></div>
      <div class="f"><label for="phone">Phone</label><input id="phone" inputmode="tel" placeholder="01012345678"
          autocomplete="off"><small>Enter a valid Egyptian mobile number (11 digits).</small></div>
      <div class="f"><label for="email">Email</label><input id="email" placeholder="name@example.com"
          autocomplete="off"><small>Enter a valid email address.</small></div>
      <div class="row"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save</button>
      </div>
    </div>
  </div>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
